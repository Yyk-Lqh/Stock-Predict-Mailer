name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --extra trees --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject data, keys, models and oversized files
        run: python scripts/check_repo_hygiene.py
      - name: Reject whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
