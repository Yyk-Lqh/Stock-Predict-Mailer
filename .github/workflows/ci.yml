name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-only:
    name: agent without research dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.11
      - run: uv sync --python 3.11 --locked
      - run: uv run python -m unittest discover -s tests -p test_agent_service.py -v
      - run: uv run python -m unittest discover -s tests -p test_control.py -v
      - run: uv run python -m unittest discover -s tests -p test_private_knowledge.py -v
      - run: uv run python -m unittest discover -s tests -p test_cleaning_agent.py -v
      - run: uv run python -m unittest discover -s tests -p test_knowledge_publication.py -v
      - run: node --check src/stock_predict_mailer/control/web/app.js
      - run: node --check src/stock_predict_mailer/control/web/memory.js
      - run: node tests/test_pony_floor.cjs
      - run: node tests/test_pony_office_refinement.cjs
      - run: node tests/test_pony_door_anchor.cjs
      - run: node tests/test_hall_data.cjs
      - run: uv run python scripts/build_console.py --check

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag past v7, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --all-extras --locked
      - name: Lint
        # The data-plane training scripts are an upstream delivery.
        run: uv run ruff check src/stock_predict_mailer tests scripts
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reject data, keys, models and oversized files
        run: python scripts/check_repo_hygiene.py
      - name: Reject stray spellings of the project name
        run: python scripts/check_naming.py
      - name: Reject whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
