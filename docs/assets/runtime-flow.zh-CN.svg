<text x="40" y="66" class="title">从上游预测到可核对的证据</text>
<text x="40" y="104" class="sub">Stock-Predict-Mailer / 本机运行 / 每个边界保留明确授权</text>
<path d="M1156 54H1198" stroke="#94a3b8" class="edge"/>
<text x="1208" y="59" class="hint">默认路径</text>
<path d="M1332 54H1374" stroke="#94a3b8" class="edge optional"/>
<text x="1384" y="59" class="hint">显式启用或单独命令</text>
