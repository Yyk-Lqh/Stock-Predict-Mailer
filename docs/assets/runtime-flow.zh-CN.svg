<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">从上游预测到可核对的证据</title><desc id="description">详细运行流程：严格接入、可选归档与知识库、有界分析、报告、持久投递、观测时点、预览及显式 CLI 回执。</desc>
