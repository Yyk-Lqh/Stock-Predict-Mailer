<text x="1176" y="93" class="hint">移动标记仅示意路径</text>
<rect x="40" y="186" width="9" height="9" rx="2" fill="#60a5fa"/>
<text x="60" y="195" class="lane">01 / 校验、分析与报告</text>
<path d="M40 510H1560" stroke="#1b2740" stroke-width="1"/>
<rect x="40" y="528" width="9" height="9" rx="2" fill="#fbbf24"/>
<text x="60" y="537" class="lane">02 / 按需能力与持久化交付</text>
<path d="M40 862H1560" stroke="#1b2740" stroke-width="1"/>
<rect x="40" y="880" width="9" height="9" rx="2" fill="#a78bfa"/>
<text x="60" y="889" class="lane">03 / 在正确时点核对观测</text>
<rect x="40" y="226" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M41 239V269" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
<text x="58" y="260" class="name">接收上游预测</text>
<text x="58" y="292" class="body">Mock / 文件 / HTTP 或控制台任务</text>
<text x="58" y="316" class="body">预测结果由上游模型负责</text>
<text x="58" y="340" class="body">方向、数值、周期与时间声明</text>
<rect x="430" y="226" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M431 239V269" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
<text x="448" y="260" class="name">严格输入门禁</text>
<text x="448" y="292" class="body">版本、标的与有限数字</text>
<text x="448" y="316" class="body">预测未过期，上下文在当时可用</text>
<text x="448" y="340" class="body">非法或过期输入阻断任务</text>
<rect x="820" y="226" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M821 239V269" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
<text x="838" y="260" class="name">有界分析</text>
<text x="838" y="292" class="body">确定性分析或已配置 Agent</text>
<text x="838" y="316" class="body">MCP / A2A：获准工具与角色</text>
<text x="838" y="340" class="body">时间、调用、步骤和费用上限</text>
<rect x="1210" y="226" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M1211 239V269" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
<text x="1228" y="260" class="name">带证据的分层报告</text>
<text x="1228" y="292" class="body">事实 / 推断 / 限制 / 风险</text>
<text x="1228" y="316" class="body">JSON、转义 HTML 与图表资料</text>
<text x="1228" y="340" class="body">冻结邮件沿用同一份来源证据</text>
<rect x="40" y="568" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M41 581V611" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
<text x="58" y="602" class="name">显式事前归档</text>
<text x="58" y="634" class="body">本轮声明目标、指标、单位与日历</text>
<text x="58" y="658" class="body">在可选服务调用前固定口径</text>
<text x="58" y="682" class="body">不可覆盖；下一轮不继承开关</text>
<rect x="430" y="568" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M431 581V611" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
<text x="448" y="602" class="name">私有知识库</text>
<text x="448" y="634" class="body">上传 → 清洗 → 审批 → 索引</text>
<text x="448" y="658" class="body">Worker 沿用同一工作区和密钥</text>
<text x="448" y="682" class="body">仅引用有权限且符合截止的证据</text>
<rect x="820" y="568" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M821 581V611" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
<text x="838" y="602" class="name">会话与任务进度</text>
<text x="838" y="634" class="body">记忆、检查点和事件流</text>
<text x="838" y="658" class="body">委派、失败与降级明确展示</text>
<text x="838" y="682" class="body">场景动画不等于模型正在调用</text>
<rect x="1210" y="568" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M1211 581V611" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
<text x="1228" y="602" class="name">MailCore 持久发件箱</text>
<text x="1228" y="634" class="body">冻结正文、收件人与投递端点</text>
<text x="1228" y="658" class="body">去重 → 交付 → 状态审计</text>
<text x="1228" y="682" class="body">有界重试；不确定结果人工核对</text>
<rect x="40" y="920" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M41 933V963" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
<text x="58" y="954" class="name">显式导入观测</text>
<text x="58" y="986" class="body">UTF-8 JSON 或固定字段单行 CSV</text>
<text x="58" y="1010" class="body">不猜测单位、复权口径或交易日</text>
<text x="58" y="1034" class="body">256 KiB；原文与标准观测摘要</text>
<rect x="430" y="920" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M431 933V963" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
<text x="448" y="954" class="name">匹配与时点门禁</text>
<text x="448" y="986" class="body">标的 / 指标 / 单位 / 合成标记</text>
<text x="448" y="1010" class="body">观测时点必须等于事前目标</text>
<text x="448" y="1034" class="body">到期且可用时间 ≤ 截止 ≤ 现在</text>
<rect x="820" y="920" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M821 933V963" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
<text x="838" y="954" class="name">网页预览 · 不写入</text>
<text x="838" y="986" class="body">未到期或不可用：不显示评分</text>
<text x="838" y="1010" class="body">符合条件：方向与数值误差</text>
<text x="838" y="1034" class="body">persisted=false；档案不变</text>
<rect x="1210" y="920" width="350" height="140" rx="12" fill="#111c2e" stroke="#2a3a52"/>
<path d="M1211 933V963" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
<text x="1228" y="954" class="name">单独执行 CLI 评估</text>
<text x="1228" y="986" class="body">显式 forecast evaluate 命令</text>
<text x="1228" y="1010" class="body">追加不可覆盖的版本化回执</text>
<text x="1228" y="1034" class="body">不改变原始分析报告</text>
