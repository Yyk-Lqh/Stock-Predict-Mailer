<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考角色 · 逐帧对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#242424;font:14px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px}h1{font-size:22px;margin:0 0 8px}p{color:#646464;margin:6px 0 20px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:6px 12px;border:1px solid #c9c9c5;background:white;border-radius:5px}input[type=range]{width:220px}.comparison{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.panel{min-height:380px;background:white;padding:16px;border:1px solid #deded9}.label{font-size:12px;color:#666;margin-bottom:8px}.stage{position:relative;width:235px;height:316px;margin:auto}.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%}.stage.walk{width:100%;height:360px}.stage.walk img{object-fit:contain}.stage.walk svg{width:100%;height:100%}.metrics{font-variant-numeric:tabular-nums;color:#333;margin-top:20px}.seats{display:grid;grid-template-columns:repeat(6,1fr);margin-top:20px;background:white;border:1px solid #deded9}.seat svg{width:100%;height:200px}.seat{text-align:center;font-size:12px;color:#666}a{color:#315654}@media(max-width:800px){.comparison{grid-template-columns:1fr}.seats{grid-template-columns:repeat(3,1fr)}}
</style><main><h1>参考角色 · 逐帧对照</h1><p>原始素材与办公室使用的同一套 SVG 渲染。静态图核对轮廓和眼睛；行走按视频 B 时间码定位；坐姿取自视频 A。</p>
<div class="controls"><select id="mode"><option value="still">静态母版</option><option value="walk">向右行走</option></select><button id="play">播放</button><label>动作相位 <input id="phase" type="range" min="0" max="17" step=".01" value="0"></label><label>叠加透明度 <input id="opacity" type="range" min="0" max="1" step=".05" value=".5"></label><span id="stamp"></span></div>
<div class="comparison"><div class="panel"><div class="label">原始参考</div><div class="stage" id="source-stage"><img id="source"></div></div><div class="panel"><div class="label">重构角色</div><div class="stage" id="render-stage"><svg id="render"></svg></div></div><div class="panel"><div class="label">同尺度叠加</div><div class="stage" id="overlay-stage"><img id="overlay-source"><svg id="overlay"></svg></div></div></div>
<div class="metrics" id="metrics">正在核对参考轮廓…</div><div class="seats" id="seats"></div><p>行走源帧读取项目内的解码工作目录；完整设计见 <a href="../docs/superpowers/specs/2026-11-12-reference-character-reconstruction-design.md">角色重构设计方案</a>。开关门、落座和其他方向属于补充衔接动作。</p></main>
<script src="../src/stock_predict_mailer/control/web/modules/pony-reference.js"></script><script src="../src/stock_predict_mailer/control/web/modules/pony-rig.js"></script>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),role={id:'main',name:'主 Agent',color:'#ed2f31'};
function mount(svg,index){svg.setAttribute('xmlns',NS);const node=document.createElementNS(NS,'g');node.innerHTML=PonyRig.markup(role,index);svg.append(node);return node;}
const avatar=mount($('render'),'check'),overlay=mount($('overlay'),'overlay');let playing=false,previous=0,lastSource=-1;
function paint(){const walking=$('mode').value==='walk',p=Number($('phase').value),frame=12+Math.floor(p),pose=walking?PonyRig.sampleWalk(p/18*Math.PI*2):PonyReference.still;
 const source=walking?`../.tmp/character-reference-review/video-b/frame-${String(frame+1).padStart(4,'0')}.png`:'../docs/superpowers/specs/assets/2026-11-12-character-reference/reference-still.png';
 for(const name of ['source-stage','render-stage','overlay-stage'])$(name).classList.toggle('walk',walking);
 for(const name of ['render','overlay'])$(name).setAttribute('viewBox',walking?'-160 -207 308.39 223.89':'-67.826087 -160.521739 132.826087 178.608696');
 PonyRig.paintReference(avatar,pose);PonyRig.paintReference(overlay,pose);$('overlay').style.opacity=$('opacity').value;
 $('source').src=source;$('overlay-source').src=source;$('stamp').textContent=walking?`视频 B · f${frame} · ${(frame/30).toFixed(3)} 秒`:'静态参考 · 235 × 316';
 if(walking){const scale=pose.pixelScale,viewBox=`${-pose.origin[0]*scale} ${-pose.origin[1]*scale} ${854*scale} ${620*scale}`;for(const name of ['render','overlay'])$(name).setAttribute('viewBox',viewBox);$('metrics').textContent='行走源坐标重投影：保留原始平移、尺寸与身体起伏；整数相位对应原视频帧，帧间形变为补间。';lastSource=-1;}
 else{if(lastSource!==-2){lastSource=-2;requestAnimationFrame(()=>measureStill());}}
}
async function measureStill(){await $('source').decode();const s=$('render').cloneNode(true);s.querySelector('.pony-ground').remove();s.setAttribute('width',235);s.setAttribute('height',316);const pic=new Image();pic.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(s));await pic.decode();const canvas=document.createElement('canvas');canvas.width=235;canvas.height=316;const c=canvas.getContext('2d',{willReadFrequently:true});c.fillStyle='white';c.fillRect(0,0,235,316);c.drawImage($('source'),0,0);const a=c.getImageData(0,0,235,316).data;c.fillRect(0,0,235,316);c.drawImage(pic,0,0);const b=c.getImageData(0,0,235,316).data;let intersection=0,union=0,headI=0,headU=0;for(let p=0;p<235*284;p++){const i=p*4,aa=Math.max(a[i],a[i+1],a[i+2])<45,bb=Math.max(b[i],b[i+1],b[i+2])<45;if(aa&&bb){intersection++;if(p<235*158)headI++;}if(aa||bb){union++;if(p<235*158)headU++;}}window.__referenceMetrics={silhouetteIoU:intersection/union,headIoU:headI/headU};$('metrics').textContent=`静态黑色轮廓重叠率 ${(intersection/union*100).toFixed(2)}% · 头部 ${(headI/headU*100).toFixed(2)}%（同尺度，无阴影；仅为辅助指标）`;return window.__referenceMetrics;}
const seats=[];for(const [index,id]of ['prediction','main','risk','mail','advice','charts'].entries()){const card=document.createElement('div');card.className='seat';card.innerHTML=`<svg viewBox="-65 -150 130 165"></svg><span>${id}</span>`;$('seats').append(card);const svg=card.querySelector('svg'),a=document.createElementNS(NS,'g'),colors=['#66a460','#ed2f31','#5200cf','#1485cf','#d4bb10','#16c1b0'];a.innerHTML=PonyRig.markup({id,name:id,color:colors[index]},'seat');svg.append(a);seats.push({rig:PonyRig.bind(a),actor:{id,seed:index,pose:'seated',state:'idle',phase:0,deskX:0,deskY:-70*.88,heading:1}});}
function tick(now){const dt=previous?(now-previous)/1000:0;previous=now;if(playing){$('phase').value=(Number($('phase').value)+dt*30)%18;paint();}for(const {rig,actor}of seats)PonyRig.render(rig,actor,now/1000,1,{x:0,y:0},1,'screensaver');requestAnimationFrame(tick);}
$('mode').onchange=()=>{lastSource=-1;paint();};$('phase').oninput=paint;$('opacity').oninput=paint;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';};paint();requestAnimationFrame(tick);window.__characterCheck={avatar,overlay,paint,measureStill,seats};
</script></html>
